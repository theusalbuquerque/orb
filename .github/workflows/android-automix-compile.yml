name: Android Automix compile

on:
  push:
    paths:
      - "scripts/**"
      - "app/src/**"
      - "app/src/main/java/com/music/orb/playback/**"
      - "app/src/main/java/com/music/orb/playback/smart/**"
      - "app/src/main/java/com/music/orb/data/settings/**"
      - "app/src/main/java/com/music/orb/ui/**"
      - "app/src/main/java/com/music/orb/MainActivity.kt"
      - "app/src/main/res/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-automix-compile.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "app/src/**"
      - "app/src/main/java/com/music/orb/playback/**"
      - "app/src/main/java/com/music/orb/playback/smart/**"
      - "app/src/main/java/com/music/orb/data/settings/**"
      - "app/src/main/java/com/music/orb/ui/**"
      - "app/src/main/java/com/music/orb/MainActivity.kt"
      - "app/src/main/res/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-automix-compile.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile Dev and Prod Kotlin
        run: ./gradlew :app:compileDevDebugKotlin :app:compileProdDebugKotlin --stacktrace

      - name: Check Automix network policy
        run: ./gradlew :app:testDevDebugUnitTest --tests com.music.orb.AutomixNetworkPolicyTest

      - name: Assemble Dev and Prod debug APKs
        run: ./gradlew :app:assembleDevDebug :app:assembleProdDebug --stacktrace

      - name: Verify native 16 KB page alignment
        run: python3 scripts/check_native_page_alignment.py 'app/build/outputs/apk/**/*.apk'

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Dev and Prod cold startup on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 scripts/check_android_startup.py

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Orb-startup-diagnostics
          path: startup-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verified debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: Orb-debug-16KB
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Package updated Orb
        run: |
          zip -qr Orb-Automix-atualizado.zip . \
            -x ".git/*" \
            -x ".gradle/*" \
            -x "**/build/*" \
            -x "Orb-Automix-atualizado.zip"

      - name: Upload updated Orb ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Orb-Automix-atualizado
          path: Orb-Automix-atualizado.zip
          if-no-files-found: error
          retention-days: 7
