name: Android Automix compile

on:
  push:
    paths:
      - "app/src/**"
      - "app/src/main/java/com/music/orb/playback/**"
      - "app/src/main/java/com/music/orb/playback/smart/**"
      - "app/src/main/java/com/music/orb/data/settings/**"
      - "app/src/main/java/com/music/orb/ui/**"
      - "app/src/main/java/com/music/orb/MainActivity.kt"
      - "app/src/main/res/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-automix-compile.yml"
  pull_request:
    paths:
      - "app/src/**"
      - "app/src/main/java/com/music/orb/playback/**"
      - "app/src/main/java/com/music/orb/playback/smart/**"
      - "app/src/main/java/com/music/orb/data/settings/**"
      - "app/src/main/java/com/music/orb/ui/**"
      - "app/src/main/java/com/music/orb/MainActivity.kt"
      - "app/src/main/res/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-automix-compile.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile Dev and Prod Kotlin
        run: ./gradlew :app:compileDevDebugKotlin :app:compileProdDebugKotlin --stacktrace

      - name: Assemble Dev and Prod debug APKs
        run: ./gradlew :app:assembleDevDebug :app:assembleProdDebug --stacktrace

      - name: Package updated Orb
        run: |
          zip -qr Orb-Automix-atualizado.zip . \
            -x ".git/*" \
            -x ".gradle/*" \
            -x "**/build/*" \
            -x "Orb-Automix-atualizado.zip"

      - name: Upload updated Orb ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Orb-Automix-atualizado
          path: Orb-Automix-atualizado.zip
          if-no-files-found: error
          retention-days: 7
