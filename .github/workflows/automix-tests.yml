name: Automix planner tests

on:
  push:
    paths:
      - "orb_automix_api.py"
      - "test_automix_planner.py"
      - "requirements.txt"
      - ".github/workflows/automix-tests.yml"
  pull_request:
    paths:
      - "orb_automix_api.py"
      - "test_automix_planner.py"
      - "requirements.txt"
      - ".github/workflows/automix-tests.yml"

jobs:
  planner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install server dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile orb_automix_api.py test_automix_planner.py

      - name: Planner regression tests
        run: python -m unittest -v test_automix_planner.py
